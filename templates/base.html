<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Card Ledger{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <a class="brand" href="{{ url_for('index') }}">Card Ledger</a>
    {% if g.user %}
      <nav>
        <a href="{{ url_for('new_loan') }}" class="button">+ New loan</a>
        <span class="me">{{ person(g.user.username, g.user.first_name) }}</span>
        <form method="post" action="{{ url_for('logout') }}"><button class="link">Log out</button></form>
      </nav>
    {% endif %}
  </header>
  <main>
    {% for category, message in get_flashed_messages(with_categories=true) %}
      <p class="flash {{ category }}">{{ message }}</p>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
