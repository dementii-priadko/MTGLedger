services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ledger}
      POSTGRES_DB: ledger
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"   # for running the app outside Docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://ledger:${POSTGRES_PASSWORD:-ledger}@db:5432/ledger
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"   # put nginx/a tunnel in front for public access
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Daily CSV of active loans to a Telegram user (see backup.py). Idle unless a recipient is configured.
  backup:
    build: .
    command: ["python", "-u", "backup.py", "--daemon"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://ledger:${POSTGRES_PASSWORD:-ledger}@db:5432/ledger
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
